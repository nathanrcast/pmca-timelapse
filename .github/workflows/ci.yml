name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lint --stacktrace
      - name: Unit tests and ShotPlan coverage
        run: ./gradlew :core:check :app:testDebugUnitTest --stacktrace
      - name: Log analyzer tests
        run: python3 -I -m unittest discover -s tools -p 'test_*.py'
      - name: Assemble a real MP4 from generated frames
        run: |
          sudo apt-get install -y ffmpeg
          mkdir -p /tmp/frames
          ffmpeg -loglevel error -f lavfi -i testsrc=size=320x240:rate=1 -frames:v 10 /tmp/frames/DSC%05d.JPG
          tools/assemble.sh /tmp/frames --out /tmp/out.mp4
          frames=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 /tmp/out.mp4)
          echo "frames in MP4: $frames"
          test "$frames" -ge 10
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
