plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jonasjuffinger.timelapse'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.nathanrcast.timelapse'
        minSdk 10
        targetSdk 10
        versionCode 7
        versionName '1.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        outputFileName = "TimeLapsePlus-${output.baseName}-${variant.versionName}.apk"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-options'
}

dependencies {
    compileOnly 'com.github.ma1co.OpenMemories-Framework:stubs:-SNAPSHOT'
    implementation 'com.github.ma1co.OpenMemories-Framework:framework:-SNAPSHOT'
}
