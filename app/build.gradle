plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jonasjuffinger.timelapse'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.nathanrcast.timelapse'
        minSdk 10
        targetSdk 10
        versionCode 7
        versionName '1.4.0'
    }

    buildTypes {
        release {
            vcsInfo.include false
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    lint {
        abortOnError true
        fatal += ['NewApi', 'InlinedApi']
        // Play Store / ChromeOS policy checks; the app is sideloaded onto API 10 cameras.
        disable 'ExpiredTargetSdkVersion', 'PermissionImpliesUnsupportedChromeOsHardware'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-options'
}

dependencies {
    compileOnly files('libs/openmemories-stubs-f8df350.jar')
    implementation files('libs/openmemories-framework-f8df350.jar')
}
